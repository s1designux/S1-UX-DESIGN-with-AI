<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S1 UI individual consumer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../dist/assets/css/tokens.css">
  <link rel="stylesheet" href="../dist/assets/css/typography.css">
  <link rel="stylesheet" href="../dist/components/input.css">
  <link rel="stylesheet" href="../dist/components/button.css">
  <link rel="stylesheet" href="../dist/components/checkbox.css">
  <link rel="stylesheet" href="../dist/components/radio.css">
  <link rel="stylesheet" href="../dist/components/toggle.css">
  <link rel="stylesheet" href="../dist/components/chip.css">
</head>
<body>
  <main>
    <div data-s1-component="input" data-size="md" data-break="pc">
      <label data-s1-part="label" for="consumer-name">이름</label>
      <div data-s1-part="field">
        <input id="consumer-name" data-s1-part="control" placeholder="내용을 입력하세요">
        <button type="button" data-s1-part="action" data-action="clear" aria-label="입력 내용 지우기" hidden><span data-s1-part="action-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <button type="button" data-s1-component="button" data-variant="primary" data-size="md"><span data-s1-part="label">확인</span></button>
    <div data-s1-component="checkbox">
      <input type="checkbox" id="consumer-agree" data-s1-part="control">
      <label data-s1-part="label" for="consumer-agree">선택 항목</label>
    </div>
    <div data-s1-component="checkbox">
      <input type="checkbox" data-s1-part="control" aria-label="라벨 없는 선택 항목">
    </div>
    <fieldset>
      <legend>보기 선택</legend>
      <div data-s1-component="radio">
        <input type="radio" id="consumer-option-1" name="consumer-option" data-s1-part="control">
        <label data-s1-part="label" for="consumer-option-1">옵션 1</label>
      </div>
      <div data-s1-component="radio">
        <input type="radio" id="consumer-option-2" name="consumer-option" data-s1-part="control">
        <label data-s1-part="label" for="consumer-option-2">옵션 2</label>
      </div>
      <div data-s1-component="radio">
        <input type="radio" name="consumer-option" data-s1-part="control" aria-label="라벨 없는 옵션">
      </div>
    </fieldset>
    <button type="button" data-s1-component="toggle" role="switch" aria-checked="false" aria-label="알림 받기">
      <span data-s1-part="knob" aria-hidden="true"></span>
    </button>
    <button type="button" data-s1-component="toggle" role="switch" aria-checked="true" aria-label="자동 저장" disabled>
      <span data-s1-part="knob" aria-hidden="true"></span>
    </button>
    <div>
      <button type="button" data-s1-component="chip" data-variant="line" data-size="md" data-break="pc" aria-pressed="false"><span data-s1-part="label">라인 칩</span></button>
      <button type="button" data-s1-component="chip" data-variant="solid" data-size="md" data-break="pc" aria-pressed="true"><span data-s1-part="label">솔리드 칩</span></button>
      <button type="button" data-s1-component="chip" data-variant="line" data-size="sm" data-break="mobile" aria-pressed="false" disabled><span data-s1-part="label">비활성 칩</span></button>
    </div>
  </main>
  <script type="module">
    import { init as initInput } from "../dist/components/input.js";
    import "../dist/components/button.js";
    import "../dist/components/checkbox.js";
    import "../dist/components/radio.js";
    import { init as initToggle } from "../dist/components/toggle.js";
    import { init as initChip } from "../dist/components/chip.js";
    document.querySelectorAll('[data-s1-component="input"]').forEach((root) => initInput(root));
    document.querySelectorAll('[data-s1-component="toggle"]').forEach((root) => initToggle(root));
    document.querySelectorAll('[data-s1-component="chip"]').forEach((root) => initChip(root));
  </script>
</body>
</html>
