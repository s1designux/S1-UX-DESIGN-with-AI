<div data-s1-component="modal" data-break="pc" data-footer="dual" hidden>
  <div data-s1-part="overlay"></div>
  <div data-s1-part="panel" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-message" tabindex="-1">
    <div data-s1-part="content">
      <div data-s1-part="header">
        <h2 data-s1-part="title" id="confirm-modal-title">제목 영역</h2>
        <button type="button" data-s1-part="close" aria-label="닫기"></button>
      </div>
      <div data-s1-part="body">
        <p data-s1-part="message" id="confirm-modal-message">변경한 내용이 저장되지 않고 사라집니다.
정말 이 작업을 진행하시겠어요?</p>
      </div>
    </div>
    <div data-s1-part="footer">
      <button type="button" data-s1-component="button" data-variant="secondary" data-size="xxsm"><span data-s1-part="label">취소</span></button>
      <button type="button" data-s1-component="button" data-variant="primary" data-size="xxsm"><span data-s1-part="label">확인</span></button>
    </div>
  </div>
</div>
