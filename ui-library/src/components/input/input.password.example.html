<div data-s1-component="input" data-size="md" data-break="pc">
  <div data-s1-part="field">
    <input id="profile-password" data-s1-part="control" type="password" aria-label="비밀번호" placeholder="비밀번호를 입력하세요">
    <button type="button" data-s1-part="action" data-action="password" aria-pressed="false" aria-label="비밀번호 보기">
      <span data-s1-part="action-icon" aria-hidden="true"></span>
    </button>
    <button type="button" data-s1-part="action" data-action="clear" aria-label="비밀번호 지우기" hidden>
      <span data-s1-part="action-icon" aria-hidden="true"></span>
    </button>
  </div>
</div>
