<div data-s1-component="date-picker" data-size="md" data-break="mobile" data-mode="single">
  <button type="button" data-s1-part="trigger" aria-haspopup="dialog" aria-expanded="false">
    <span data-s1-part="value">YY.MM.DD</span>
    <span data-s1-part="icon" aria-hidden="true"></span>
  </button>
  <div data-s1-part="sheet" hidden>
    <div data-s1-part="sheet-backdrop"></div>
    <div data-s1-part="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="date-picker-mobile-sheet-title" tabindex="-1">
      <div data-s1-part="sheet-header">
        <span data-s1-part="sheet-title" id="date-picker-mobile-sheet-title">날짜 선택</span>
        <button type="button" data-s1-part="sheet-close" aria-label="닫기"></button>
      </div>
      <div data-s1-part="calendar-wrap">
        <div data-s1-part="calendar"></div>
      </div>
      <div data-s1-part="sheet-footer">
        <button type="button" data-s1-part="apply" data-s1-component="button" data-variant="primary" data-size="lg">
          <span data-s1-part="label">적용</span>
        </button>
      </div>
    </div>
  </div>
</div>
