<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S1 UI empty consumer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../dist/assets/css/tokens.css">
  <link rel="stylesheet" href="../dist/assets/css/typography.css">
  <link rel="stylesheet" href="../dist/s1-ui.css">
</head>
<body>
  <main>
    <div data-s1-component="input" data-size="md" data-break="pc">
      <label data-s1-part="label" for="consumer-name">이름</label>
      <div data-s1-part="field">
        <input id="consumer-name" data-s1-part="control" placeholder="내용을 입력하세요">
        <button type="button" data-s1-part="action" data-action="clear" aria-label="입력 내용 지우기" hidden><span data-s1-part="action-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <button type="button" data-s1-component="button" data-variant="primary" data-size="md"><span data-s1-part="label">확인</span></button>
  </main>
  <script type="module">
    import { input } from "../dist/s1-ui.js";
    document.querySelectorAll('[data-s1-component="input"]').forEach((root) => input.init(root));
  </script>
</body>
</html>
