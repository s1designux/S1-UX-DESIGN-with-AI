<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S1 UI individual consumer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../dist/assets/css/tokens.css">
  <link rel="stylesheet" href="../dist/assets/css/typography.css">
  <link rel="stylesheet" href="../dist/components/input.css">
  <link rel="stylesheet" href="../dist/components/button.css">
  <link rel="stylesheet" href="../dist/components/checkbox.css">
  <link rel="stylesheet" href="../dist/components/radio.css">
  <link rel="stylesheet" href="../dist/components/toggle.css">
  <link rel="stylesheet" href="../dist/components/chip.css">
  <link rel="stylesheet" href="../dist/components/dropdown.css">
  <link rel="stylesheet" href="../dist/components/select.css">
  <link rel="stylesheet" href="../dist/components/filter-chip.css">
  <link rel="stylesheet" href="../dist/components/tab.css">
  <link rel="stylesheet" href="../dist/components/pagination.css">
  <link rel="stylesheet" href="../dist/components/textarea.css">
  <link rel="stylesheet" href="../dist/components/multi-toggle.css">
  <link rel="stylesheet" href="../dist/components/table.css">
  <link rel="stylesheet" href="../dist/components/modal.css">
</head>
<body>
  <main>
    <div data-s1-component="input" data-size="md" data-break="pc">
      <label data-s1-part="label" for="consumer-name">이름</label>
      <div data-s1-part="field">
        <input id="consumer-name" data-s1-part="control" placeholder="내용을 입력하세요">
        <button type="button" data-s1-part="action" data-action="clear" aria-label="입력 내용 지우기" hidden><span data-s1-part="action-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <button type="button" data-s1-component="button" data-variant="primary" data-size="md"><span data-s1-part="label">확인</span></button>
    <div data-s1-component="checkbox">
      <input type="checkbox" id="consumer-agree" data-s1-part="control">
      <label data-s1-part="label" for="consumer-agree">선택 항목</label>
    </div>
    <div data-s1-component="checkbox">
      <input type="checkbox" data-s1-part="control" aria-label="라벨 없는 선택 항목">
    </div>
    <fieldset>
      <legend>보기 선택</legend>
      <div data-s1-component="radio">
        <input type="radio" id="consumer-option-1" name="consumer-option" data-s1-part="control">
        <label data-s1-part="label" for="consumer-option-1">옵션 1</label>
      </div>
      <div data-s1-component="radio">
        <input type="radio" id="consumer-option-2" name="consumer-option" data-s1-part="control">
        <label data-s1-part="label" for="consumer-option-2">옵션 2</label>
      </div>
      <div data-s1-component="radio">
        <input type="radio" name="consumer-option" data-s1-part="control" aria-label="라벨 없는 옵션">
      </div>
    </fieldset>
    <button type="button" data-s1-component="toggle" role="switch" aria-checked="false" aria-label="알림 받기">
      <span data-s1-part="knob" aria-hidden="true"></span>
    </button>
    <button type="button" data-s1-component="toggle" role="switch" aria-checked="true" aria-label="자동 저장" disabled>
      <span data-s1-part="knob" aria-hidden="true"></span>
    </button>
    <div>
      <button type="button" data-s1-component="chip" data-variant="line" data-size="md" data-break="pc" aria-pressed="false"><span data-s1-part="label">라인 칩</span></button>
      <button type="button" data-s1-component="chip" data-variant="solid" data-size="md" data-break="pc" aria-pressed="true"><span data-s1-part="label">솔리드 칩</span></button>
      <button type="button" data-s1-component="chip" data-variant="line" data-size="sm" data-break="mobile" aria-pressed="false" disabled><span data-s1-part="label">비활성 칩</span></button>
    </div>
    <div data-s1-component="dropdown" data-type="text" data-size="md" role="listbox" aria-label="정렬">
      <div data-s1-part="option" role="option" aria-selected="true" tabindex="0" data-value="latest"><span data-s1-part="option-label">최신순</span></div>
      <div data-s1-part="option" role="option" aria-selected="false" tabindex="-1" data-value="popular"><span data-s1-part="option-label">인기순</span></div>
    </div>
    <div data-s1-component="select" data-size="md" data-break="pc">
      <button type="button" data-s1-part="trigger" aria-haspopup="listbox" aria-expanded="false">
        <span data-s1-part="value">선택</span>
        <span data-s1-part="icon" aria-hidden="true"></span>
      </button>
      <div data-s1-part="panel" hidden>
        <div data-s1-component="dropdown" data-type="text" data-size="md" role="listbox" aria-label="선택">
          <div data-s1-part="option" role="option" aria-selected="false" tabindex="0" data-value="seoul"><span data-s1-part="option-label">서울</span></div>
          <div data-s1-part="option" role="option" aria-selected="false" tabindex="-1" data-value="busan"><span data-s1-part="option-label">부산</span></div>
        </div>
      </div>
    </div>
    <div data-s1-component="filter-chip" data-variant="line" data-size="sm" data-break="pc" data-title="on">
      <button type="button" data-s1-part="trigger" aria-haspopup="listbox" aria-expanded="false">
        <span data-s1-part="title">정렬</span>
        <span data-s1-part="value">최신순</span>
        <span data-s1-part="icon" aria-hidden="true"></span>
      </button>
      <div data-s1-part="panel" hidden>
        <div data-s1-component="dropdown" data-type="text" data-size="xxsm" role="listbox" aria-label="정렬">
          <div data-s1-part="option" role="option" aria-selected="true" tabindex="0" data-value="latest"><span data-s1-part="option-label">최신순</span></div>
          <div data-s1-part="option" role="option" aria-selected="false" tabindex="-1" data-value="past"><span data-s1-part="option-label">과거순</span></div>
        </div>
      </div>
    </div>
    <div data-s1-component="tab" data-size="md" data-break="pc" role="tablist" aria-label="콘텐츠 보기 선택">
      <button type="button" data-s1-part="tab" role="tab" aria-selected="true">탭 메뉴 1</button>
      <button type="button" data-s1-part="tab" role="tab" aria-selected="false">탭 메뉴 2</button>
      <button type="button" data-s1-part="tab" role="tab" aria-selected="false">탭 메뉴 3</button>
    </div>
    <nav data-s1-component="pagination" data-total-pages="6" data-page="1" aria-label="페이지 탐색">
      <span data-s1-part="arrow-group"><button type="button" data-s1-action="first" aria-label="첫 페이지">«</button><button type="button" data-s1-action="previous" aria-label="이전 페이지">‹</button></span>
      <span data-s1-part="pages"><button type="button" data-s1-part="page" data-page="1" aria-current="page">1</button><button type="button" data-s1-part="page" data-page="2">2</button><button type="button" data-s1-part="page" data-page="3">3</button><button type="button" data-s1-part="page" data-page="4">4</button><button type="button" data-s1-part="page" data-page="5">5</button><button type="button" data-s1-part="page" data-page="6">6</button></span>
      <span data-s1-part="arrow-group"><button type="button" data-s1-action="next" aria-label="다음 페이지">›</button><button type="button" data-s1-action="last" aria-label="마지막 페이지">»</button></span>
    </nav>
    <div data-s1-component="textarea" data-break="pc">
      <textarea id="consumer-memo" data-s1-part="control" aria-label="설명" placeholder="여러 줄 내용을 입력하세요"></textarea>
    </div>
    <div data-s1-component="table" data-size="md">
      <table data-s1-part="table">
        <thead>
          <tr>
            <th data-s1-part="header-cell" data-selection scope="col"><div data-s1-component="checkbox"><input type="checkbox" data-s1-part="control" aria-label="전체 선택"></div></th>
            <th data-s1-part="header-cell" scope="col">항목명</th>
            <th data-s1-part="header-cell" data-align="center" scope="col">수량</th>
          </tr>
        </thead>
        <tbody>
          <tr data-s1-part="row">
            <td data-s1-part="cell" data-selection><div data-s1-component="checkbox"><input type="checkbox" data-s1-part="control" aria-label="항목 1 선택"></div></td>
            <td data-s1-part="cell">항목 1</td>
            <td data-s1-part="cell" data-align="center">10</td>
          </tr>
          <tr data-s1-part="row">
            <td data-s1-part="cell" data-selection><div data-s1-component="checkbox"><input type="checkbox" data-s1-part="control" aria-label="항목 2 선택"></div></td>
            <td data-s1-part="cell">항목 2</td>
            <td data-s1-part="cell" data-align="center">20</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div data-s1-component="multi-toggle" data-size="md" role="radiogroup" aria-label="정렬 기준">
      <button type="button" data-s1-part="cell" role="radio" aria-checked="true" data-value="left">왼쪽</button>
      <button type="button" data-s1-part="cell" role="radio" aria-checked="false" data-value="center">가운데</button>
      <button type="button" data-s1-part="cell" role="radio" aria-checked="false" data-value="right">오른쪽</button>
    </div>
    <button type="button" data-s1-component="button" data-variant="secondary" data-size="md" data-consumer-open-modal><span data-s1-part="label">모달 열기</span></button>
    <div data-s1-component="modal" data-break="pc" data-footer="dual" hidden>
      <div data-s1-part="overlay"></div>
      <div data-s1-part="panel" role="dialog" aria-modal="true" aria-labelledby="consumer-modal-title" aria-describedby="consumer-modal-message" tabindex="-1">
        <div data-s1-part="content">
          <div data-s1-part="header">
            <h2 data-s1-part="title" id="consumer-modal-title">제목 영역</h2>
            <button type="button" data-s1-part="close" aria-label="닫기"></button>
          </div>
          <div data-s1-part="body">
            <p data-s1-part="message" id="consumer-modal-message">변경한 내용이 저장되지 않고 사라집니다.
정말 이 작업을 진행하시겠어요?</p>
          </div>
        </div>
        <div data-s1-part="footer">
          <button type="button" data-s1-component="button" data-variant="secondary" data-size="xxsm" data-consumer-close-modal><span data-s1-part="label">취소</span></button>
          <button type="button" data-s1-component="button" data-variant="primary" data-size="xxsm" data-consumer-close-modal><span data-s1-part="label">확인</span></button>
        </div>
      </div>
    </div>
  </main>
  <script type="module">
    import { init as initInput } from "../dist/components/input.js";
    import "../dist/components/button.js";
    import "../dist/components/checkbox.js";
    import "../dist/components/radio.js";
    import { init as initToggle } from "../dist/components/toggle.js";
    import { init as initChip } from "../dist/components/chip.js";
    import { init as initDropdown } from "../dist/components/dropdown.js";
    import { init as initSelect } from "../dist/components/select.js";
    import { init as initFilterChip } from "../dist/components/filter-chip.js";
    import { init as initTab } from "../dist/components/tab.js";
    import { init as initPagination } from "../dist/components/pagination.js";
    import "../dist/components/textarea.js";
    import { init as initMultiToggle } from "../dist/components/multi-toggle.js";
    import { init as initTable } from "../dist/components/table.js";
    import { init as initModal } from "../dist/components/modal.js";
    document.querySelectorAll('[data-s1-component="input"]').forEach((root) => initInput(root));
    document.querySelectorAll('[data-s1-component="toggle"]').forEach((root) => initToggle(root));
    document.querySelectorAll('[data-s1-component="chip"]').forEach((root) => initChip(root));
    document.querySelectorAll('[data-s1-component="dropdown"]').forEach((root) => initDropdown(root));
    document.querySelectorAll('[data-s1-component="select"]').forEach((root) => initSelect(root));
    document.querySelectorAll('[data-s1-component="filter-chip"]').forEach((root) => initFilterChip(root));
    document.querySelectorAll('[data-s1-component="tab"]').forEach((root) => initTab(root));
    document.querySelectorAll('[data-s1-component="pagination"]').forEach((root) => initPagination(root));
    document.querySelectorAll('[data-s1-component="multi-toggle"]').forEach((root) => initMultiToggle(root));
    document.querySelectorAll('[data-s1-component="table"]').forEach((root) => initTable(root));
    const consumerModal = document.querySelector('[data-s1-component="modal"]');
    const consumerModalApi = initModal(consumerModal);
    document.querySelector("[data-consumer-open-modal]")?.addEventListener("click", () => consumerModalApi?.open());
    consumerModal?.querySelectorAll("[data-consumer-close-modal]").forEach((button) => button.addEventListener("click", () => consumerModalApi?.close({ reason: "footer-button" })));
  </script>
</body>
</html>
