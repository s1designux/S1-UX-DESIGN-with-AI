<!-- 정본 기본 채움 그대로: Footer=Single, 본문에 Bottom Sheet Option Type=Text 4줄(2번째 Selected).
     검수·예시라서 hidden 없이 열린 상태로 둔다. 루트에 data-s1-part="sheet" 를 함께 달아 date-picker·
     time-picker 가 부르는 이름과 겹쳐도 안전함을 보인다(선택 부품 — 3-build-spec.md A-2). -->
<div data-s1-component="bottom-sheet" data-s1-part="sheet" data-break="mobile" data-footer="single">
  <div data-s1-part="sheet-backdrop"></div>
  <div data-s1-part="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="bottom-sheet-example-title" tabindex="-1">
    <div data-s1-part="sheet-content">
      <div data-s1-part="sheet-header">
        <span data-s1-part="sheet-title" id="bottom-sheet-example-title">항목 선택</span>
        <button type="button" data-s1-part="sheet-close" aria-label="닫기"></button>
      </div>
      <div data-s1-part="sheet-body">
        <div data-s1-component="bottom-sheet-option" data-type="text" data-state="default">
          <span data-s1-part="label">항목 1</span>
        </div>
        <div data-s1-component="bottom-sheet-option" data-type="text" data-state="selected">
          <span data-s1-part="label">항목 2</span>
          <span data-s1-part="check" aria-hidden="true"></span>
        </div>
        <div data-s1-component="bottom-sheet-option" data-type="text" data-state="default">
          <span data-s1-part="label">항목 3</span>
        </div>
        <div data-s1-component="bottom-sheet-option" data-type="text" data-state="default">
          <span data-s1-part="label">항목 4</span>
        </div>
      </div>
    </div>
    <div data-s1-part="sheet-footer">
      <button type="button" data-s1-component="button" data-variant="primary" data-size="lg"><span data-s1-part="label">적용</span></button>
    </div>
  </div>
</div>
