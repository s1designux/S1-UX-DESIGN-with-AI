<!-- 쓰는 법(옵션·값·이벤트·여닫기)은 components/bottom-sheet-option.md 에 있습니다. -->
<div>
  <div data-s1-component="bottom-sheet-option" data-type="text" data-state="default">
    <span data-s1-part="label">항목 1</span>
  </div>
  <div data-s1-component="bottom-sheet-option" data-type="text" data-state="selected">
    <span data-s1-part="label">항목 2</span>
    <span data-s1-part="check" aria-hidden="true"></span>
  </div>
  <div data-s1-component="bottom-sheet-option" data-type="text" data-state="disabled">
    <span data-s1-part="label">항목 3</span>
  </div>
  <div data-s1-component="bottom-sheet-option" data-type="checkbox" data-state="default">
    <div data-s1-component="checkbox">
      <input type="checkbox" id="bso-example-checkbox-default" data-s1-part="control" aria-labelledby="bso-example-checkbox-default-label">
    </div>
    <span data-s1-part="label" id="bso-example-checkbox-default-label">항목 4</span>
  </div>
  <div data-s1-component="bottom-sheet-option" data-type="checkbox" data-state="selected">
    <div data-s1-component="checkbox">
      <input type="checkbox" id="bso-example-checkbox-selected" data-s1-part="control" aria-labelledby="bso-example-checkbox-selected-label" checked>
    </div>
    <span data-s1-part="label" id="bso-example-checkbox-selected-label">항목 5</span>
  </div>
  <div data-s1-component="bottom-sheet-option" data-type="radio" data-state="default">
    <div data-s1-component="radio">
      <input type="radio" id="bso-example-radio-default" name="bso-example-radio-group" data-s1-part="control" aria-labelledby="bso-example-radio-default-label">
    </div>
    <span data-s1-part="label" id="bso-example-radio-default-label">항목 6</span>
  </div>
  <div data-s1-component="bottom-sheet-option" data-type="radio" data-state="selected">
    <div data-s1-component="radio">
      <input type="radio" id="bso-example-radio-selected" name="bso-example-radio-group" data-s1-part="control" aria-labelledby="bso-example-radio-selected-label" checked>
    </div>
    <span data-s1-part="label" id="bso-example-radio-selected-label">항목 7</span>
  </div>
  <div data-s1-component="bottom-sheet-option" data-type="list" data-state="default">
    <div data-s1-part="list-left">
      <div data-s1-part="avatar" aria-hidden="true"></div>
      <div data-s1-part="list-text">
        <span data-s1-part="list-title">제목</span>
        <span data-s1-part="list-sub">서브 텍스트</span>
      </div>
    </div>
    <span data-s1-part="chevron" aria-hidden="true"></span>
  </div>
  <div data-s1-component="bottom-sheet-option" data-type="list" data-state="disabled">
    <div data-s1-part="list-left">
      <div data-s1-part="avatar" aria-hidden="true"></div>
      <div data-s1-part="list-text">
        <span data-s1-part="list-title">제목</span>
        <span data-s1-part="list-sub">서브 텍스트</span>
      </div>
    </div>
    <span data-s1-part="lock" aria-hidden="true"></span>
  </div>
</div>
