<!-- 쓰는 법(옵션·값·이벤트·여닫기)은 components/date-picker.md 에 있습니다. -->
<div data-s1-component="date-picker" data-size="md" data-break="pc" data-mode="single">
  <button type="button" data-s1-part="trigger" aria-haspopup="dialog" aria-expanded="false">
    <span data-s1-part="value">날짜 선택</span>
    <span data-s1-part="icon" aria-hidden="true"></span>
  </button>
  <div data-s1-part="panel" role="dialog" hidden>
    <div data-s1-part="calendar"></div>
  </div>
</div>

<div data-s1-component="date-picker" data-size="md" data-break="pc" data-mode="range">
  <button type="button" data-s1-part="trigger" aria-haspopup="dialog" aria-expanded="false">
    <span data-s1-part="value">날짜 선택</span>
    <span data-s1-part="icon" aria-hidden="true"></span>
  </button>
  <div data-s1-part="panel" role="dialog" hidden>
    <div data-s1-part="calendar"></div>
  </div>
</div>

<div data-s1-component="date-picker" data-size="xsm" data-break="pc" data-mode="single">
  <button type="button" data-s1-part="trigger" aria-haspopup="dialog" aria-expanded="false">
    <span data-s1-part="value">날짜 선택</span>
    <span data-s1-part="icon" aria-hidden="true"></span>
  </button>
  <div data-s1-part="panel" role="dialog" hidden>

  </div>
</div>
