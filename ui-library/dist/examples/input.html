<div data-s1-component="input" data-size="md" data-break="pc">
  <label data-s1-part="label" for="profile-name">이름</label>
  <div data-s1-part="field">
    <input id="profile-name" data-s1-part="control" aria-describedby="profile-name-message" placeholder="내용을 입력하세요">
    <button type="button" data-s1-part="action" data-action="clear" aria-label="입력 내용 지우기" hidden>
      <span data-s1-part="action-icon" aria-hidden="true"></span>
    </button>
  </div>
  <p id="profile-name-message" data-s1-part="message">안내 메시지</p>
</div>
