<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <script>!function(){var z=localStorage.getItem("sw-ds-zoom");if(z)document.documentElement.style.zoom=z+"%"}();</script>

  <title>Components · SW UX GUIDE V2.4</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <style>
    :root{--component-guide-nav-active:var(--color-action-primary-default)}
    .main-content,.page-content{min-width:0;box-sizing:border-box}.main-content{max-width:100%}
    .page-content{padding-top:20px;max-width:none}.page-header{position:static!important;border-bottom:0;padding-bottom:16px}.page-header-inner{max-width:none}
    .comp-section{display:none;min-width:0;max-width:100%}.comp-section.is-active{display:block;margin-bottom:56px}
    .comp-section-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--color-border-subtle)}
    .comp-section-title{font-size:18px;font-weight:700;letter-spacing:-.02em}.comp-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--color-bg-level-1);color:var(--color-text-secondary)}
    .comp-badge-blue{background:var(--color-bg-level-2);color:var(--component-guide-nav-active)}.variant-block{margin-bottom:24px}.variant-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-secondary);margin-bottom:10px}
    .variant-group-desc{font-size:12px;color:var(--color-text-secondary);margin:0 0 20px}.preview-area{min-width:0;max-width:100%;box-sizing:border-box;background:var(--color-bg-level-0);border:1px solid var(--color-border-subtle);border-radius:12px;padding:24px 32px;overflow-x:auto;isolation:isolate;user-select:none}.preview-area input,.preview-area textarea{user-select:text}
    [data-theme="dark"] .preview-area{background:var(--color-bg-level-2)}
    .platform-section{min-width:0;max-width:100%;box-sizing:border-box}.platform-section+.platform-section{margin-top:24px}.view-pc .platform-section-mobile,.view-pc .platform-only-mobile{display:none!important}.view-mobile .platform-section-pc,.view-mobile .platform-only-pc{display:none!important}
    .comp-state-matrix,.state-size-matrix{display:grid;column-gap:10px;row-gap:14px;align-items:start;min-width:0}.state-size-matrix{grid-template-columns:100px 200px repeat(3,minmax(110px,1fr))}
    .matrix-col-header{font-size:12px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;text-align:center}.matrix-col-header-action{font-size:10px;font-weight:700;color:var(--color-status-success-text);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding-right:32px}
    .matrix-row-label,.comp-row-label{min-width:0;font-size:12px;font-weight:600;color:var(--color-text-secondary);text-align:left;justify-self:start;line-height:1.4;overflow-wrap:break-word}.matrix-row-label span{display:block;margin:0;font-size:11px;font-weight:400;color:var(--color-text-secondary)}
    .matrix-cell{display:flex;justify-content:center;align-items:center;min-width:0}.comp-state-cell{display:flex;justify-content:center;align-items:flex-start;min-width:0}.comp-state-cell:has(.is-disabled),.comp-state-cell:has(:disabled){cursor:default}.is-preview{pointer-events:none;cursor:default}
    .comp-action-cell{display:flex;flex-direction:column;align-items:center;min-width:0;padding-right:32px}.comp-action-top{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--color-border-subtle);overflow:visible}.comp-action-top>.matrix-col-header-action{padding-right:0;text-align:left}.comp-action-top>.comp-action-cell{align-items:flex-start;padding-right:0}
    .btn-action-row,.comp-action-top .btn-action-row{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}.btn-action-item,.comp-action-top .btn-action-item{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.comp-action-top .btn-action-item .matrix-row-label{justify-self:start}
    .action-mini-toggle{min-height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--color-border-subtle);background:var(--color-bg-level-0);font-size:11px;line-height:1;cursor:pointer;white-space:nowrap;color:var(--color-text-secondary)}.action-mini-toggle:hover{background:var(--color-bg-level-1)}.action-click-count{display:block;margin-top:8px;font-size:11px;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
    .state-size-matrix .matrix-row-label span,.comp-state-matrix .matrix-row-label span,.comp-state-matrix .comp-row-label span{display:none}.state-strip,.size-strip{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
    @media(max-width:1024px){.comp-state-matrix,.state-size-matrix{column-gap:8px}.state-size-matrix{grid-template-columns:80px 180px repeat(3,minmax(100px,1fr))}}
    .code-block{min-width:0;max-width:100%;box-sizing:border-box;margin-top:14px;border:1px solid var(--color-border-subtle);border-radius:10px;overflow:hidden}.code-tabs{display:flex;align-items:center;background:var(--color-bg-level-1);border-bottom:1px solid var(--color-border-subtle);overflow:auto}.code-tab{padding:8px 16px;font-size:11px;font-weight:600;color:var(--color-text-secondary);border:0;background:transparent;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.code-tab.active{color:var(--component-guide-nav-active);border-bottom-color:currentColor;background:var(--color-bg-level-0)}
    .code-copy-btn{margin-left:auto;margin-right:10px;font-size:10px;font-weight:600;padding:4px 10px;border-radius:5px;border:1px solid var(--color-border-subtle);background:var(--color-bg-level-1);color:var(--color-text-secondary);cursor:pointer}.code-pane{display:none;min-width:0;max-width:100%;background:var(--color-bg-level-0)}.code-pane.active{display:block}.code-pane pre{display:block;max-width:100%;margin:0;padding:16px;box-sizing:border-box;font-family:monospace;font-size:11.5px;line-height:1.7;overflow:auto;white-space:pre}
    .token-detail-table{width:100%;border-collapse:collapse;font-size:11px}.token-detail-table th,.token-detail-table td{padding:9px 12px;border-bottom:1px solid var(--color-border-subtle);text-align:left}.token-name,.token-value{font-family:monospace}
    .comp-sticky-bar{position:sticky;top:0;z-index:10;background:var(--color-bg-level-0);border-top:1px solid var(--color-border-subtle);border-bottom:1px solid var(--color-border-subtle);padding:0 40px}.category-nav{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--color-border-subtle)}.category-btn{padding:10px 16px;font-size:13px;font-weight:500;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--color-text-secondary);cursor:pointer}.category-btn.is-active{color:var(--color-text-primary);border-bottom-color:var(--component-guide-nav-active)}
    .comp-nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0}.comp-nav-btn{padding:5px 12px;font-size:12px;font-weight:500;border-radius:6px;border:1px solid var(--color-border-subtle);background:var(--color-bg-level-0);color:var(--color-text-secondary);cursor:pointer}.comp-nav-btn.is-active{background:var(--component-guide-nav-active);color:var(--color-text-inverse);border-color:var(--component-guide-nav-active)}
    .controls-sticky{padding:8px 0 10px}.theme-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--color-bg-level-0);border:1px solid var(--color-border-subtle);border-radius:12px}.theme-bar-label,.theme-hint{font-size:12px;color:var(--color-text-secondary)}.theme-toggle{display:flex;background:var(--color-bg-level-1);border-radius:8px;padding:3px;gap:2px}.theme-btn{padding:5px 16px;font-size:12px;border-radius:6px;border:0;background:transparent;color:var(--color-text-secondary);cursor:pointer}.theme-btn.active{background:var(--color-bg-level-0);color:var(--color-text-primary)}.theme-bar-divider{width:1px;height:20px;background:var(--color-border-subtle)}
    .design-mode .preview-area{outline:1px dashed var(--component-guide-nav-active);outline-offset:2px}.design-mode .preview-area [data-component]{cursor:help!important}
{{GENERATED_COMPONENT_CSS}}
  </style>
</head>
<body>
<div class="mobile-header"><button class="hamburger" id="sidebar-toggle" aria-label="메뉴 열기"><span aria-hidden="true">☰</span></button><span class="mobile-logo">Components</span></div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-header"><div class="page-header-inner"><div><h1 id="page-title">Components</h1><p>Figma 컴포넌트 정본과 Registry 메타를 자동 생성한 UI 라이브러리</p></div></div></div>
    <div class="comp-sticky-bar">
      <div class="component-filter">
        <div class="category-nav" id="categoryNav">
          <button class="category-btn is-active" data-category-filter="all">All</button><button class="category-btn" data-category-filter="actions">Actions</button><button class="category-btn" data-category-filter="selection">Selection</button><button class="category-btn" data-category-filter="form">Form</button><button class="category-btn" data-category-filter="table">Table</button><button class="category-btn" data-category-filter="navigation">Navigation</button>
        </div>
        <div class="comp-nav">
          <button class="comp-nav-btn is-active" data-section="button" data-category="actions" data-platforms="pc mobile">Button</button>
          <button class="comp-nav-btn" data-section="checkbox" data-category="selection" data-platforms="pc mobile">Checkbox</button><button class="comp-nav-btn" data-section="radio" data-category="selection" data-platforms="pc mobile">Radio</button><button class="comp-nav-btn" data-section="toggle" data-category="selection" data-platforms="pc mobile">Toggle</button><button class="comp-nav-btn" data-section="multi-toggle" data-category="selection" data-platforms="pc">Multi Toggle</button><button class="comp-nav-btn" data-section="chip" data-category="selection" data-platforms="pc mobile">Chip</button><button class="comp-nav-btn" data-section="filter-chip" data-category="selection" data-platforms="pc mobile">Filter Chip</button>
          <button class="comp-nav-btn" data-section="input" data-category="form" data-platforms="pc mobile">Input</button><button class="comp-nav-btn" data-section="date-picker" data-category="form" data-platforms="pc mobile">Date Picker</button><button class="comp-nav-btn" data-section="time-picker" data-category="form" data-platforms="pc mobile">Time Picker</button><button class="comp-nav-btn" data-section="textarea" data-category="form" data-platforms="pc mobile">Textarea</button><button class="comp-nav-btn" data-section="select" data-category="form" data-platforms="pc mobile">Select</button><button class="comp-nav-btn" data-section="dropdown" data-category="form" data-platforms="pc">Dropdown</button>
          <button class="comp-nav-btn" data-section="table" data-category="table" data-platforms="pc">Table</button>
          <button class="comp-nav-btn" data-section="tab" data-category="navigation" data-platforms="pc mobile">Line Tab</button><button class="comp-nav-btn" data-section="gnb" data-category="navigation" data-platforms="pc">GNB</button><button class="comp-nav-btn" data-section="pagination" data-category="navigation" data-platforms="pc">Pagination</button><button class="comp-nav-btn" data-section="mobile-bottom-nav" data-category="navigation" data-platforms="mobile">Bottom Nav</button><button class="comp-nav-btn" data-section="ci" data-category="navigation" data-platforms="pc mobile">CI Logo</button><button class="comp-nav-btn" data-section="footer" data-category="navigation" data-platforms="pc">Footer</button><button class="comp-nav-btn" data-section="login-gnb" data-category="navigation" data-platforms="pc">Login GNB</button>
        </div>
      </div>
      <div class="controls-sticky"><div class="theme-bar"><span class="theme-bar-label">Preview Theme</span><div class="theme-toggle"><button class="theme-btn active" data-theme-choice="light">Light</button><button class="theme-btn" data-theme-choice="dark">Dark</button></div><div class="theme-bar-divider"></div><div class="theme-toggle"><button class="theme-btn" id="btnDesignMode" type="button">Design Mode</button></div><span class="theme-hint" id="designModeHint" aria-live="polite"></span></div></div>
    </div>
    <div class="page-content">

    </div>
  </main>

{{GENERATED_COMPONENT_RUNTIME}}
<script>
;(()=>{
  const all=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
  const platform=()=>{const value=new URLSearchParams(location.search).get('platform');return value==='mobile'?'mobile':'pc'};
  function switchTab(button,paneId){const block=button.closest('.code-block');if(!block)return;all('.code-tab',block).forEach(item=>item.classList.remove('active'));all('.code-pane',block).forEach(item=>item.classList.remove('active'));button.classList.add('active');const pane=document.getElementById(paneId);if(pane)pane.classList.add('active')}
  function copyCode(id){const source=document.getElementById(id);if(!source)return;navigator.clipboard.writeText(source.innerText)}
  function visibleButtons(){return all('.comp-nav-btn').filter(button=>button.hidden===false)}
  function showSection(id,button,updateHash=true){all('.comp-section').forEach(section=>section.classList.toggle('is-active',section.id===id));all('.comp-nav-btn').forEach(item=>item.classList.toggle('is-active',item===button));if(updateHash&&location.hash!=='#'+id)history.replaceState(null,'','#'+id)}
  function filterCategory(category){all('.category-btn').forEach(button=>button.classList.toggle('is-active',button.dataset.categoryFilter===category));all('.comp-nav-btn').forEach(button=>{const supported=(button.dataset.platforms||'pc mobile').split(' ').includes(platform());button.hidden=!supported||(category!=='all'&&button.dataset.category!==category)});const active=document.querySelector('.comp-nav-btn.is-active');if(!active||active.hidden){const first=visibleButtons()[0];if(first)showSection(first.dataset.section,first)}}
  function applyPlatform(){document.documentElement.classList.toggle('view-mobile',platform()==='mobile');document.documentElement.classList.toggle('view-pc',platform()==='pc');all('.comp-nav-btn').forEach(button=>button.hidden=!(button.dataset.platforms||'pc mobile').split(' ').includes(platform()));const title=document.getElementById('page-title');if(title)title.textContent=platform()==='mobile'?'Mobile Components':'PC Components';document.title=(platform()==='mobile'?'Mobile':'PC')+' Components · S1 UX'}
  window.switchTab=switchTab;window.copyCode=copyCode;window.showSection=showSection;window.filterByCategory=filterCategory;
  document.addEventListener('click',event=>{const nav=event.target.closest('.comp-nav-btn');if(nav){showSection(nav.dataset.section,nav);return}const category=event.target.closest('.category-btn');if(category){filterCategory(category.dataset.categoryFilter);return}const theme=event.target.closest('[data-theme-choice]');if(theme){const value=theme.dataset.themeChoice;if(typeof window.setGlobalTheme==='function')window.setGlobalTheme(value);else document.documentElement.toggleAttribute('data-theme',value==='dark');all('[data-theme-choice]').forEach(button=>button.classList.toggle('active',button===theme));return}if(event.target.closest('#btnDesignMode')){const on=document.documentElement.classList.toggle('design-mode');event.target.closest('#btnDesignMode').classList.toggle('active',on);document.getElementById('designModeHint').textContent=on?'컴포넌트 검사 켜짐':''}});
  all('.comp-nav-btn').sort((a,b)=>a.textContent.trim().localeCompare(b.textContent.trim(),undefined,{sensitivity:'base'})).forEach(button=>button.parentElement.appendChild(button));
  applyPlatform();const requested=location.hash.slice(1);let initial=all('.comp-nav-btn').find(button=>button.dataset.section===requested&&!button.hidden);if(!initial)initial=visibleButtons()[0];if(initial)showSection(initial.dataset.section,initial,false);
})();
</script>
<script src="../assets/js/main.js"></script>
</body>
