<script>
/* 뷰어 테마를 디자인시스템 토큰의 data-theme 로 잇는다 — 뷰어가 명시하면 그대로, "시스템"이면 OS 설정을 따른다 */
(function () {
  var root = document.documentElement;
  var mine = false;
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function sync() {
    var v = root.getAttribute("data-theme");
    if (v && !mine) return;
    if (mq && mq.matches) { root.setAttribute("data-theme", "dark"); mine = true; }
    else if (mine) { root.removeAttribute("data-theme"); mine = false; }
  }
  sync();
  if (mq && mq.addEventListener) mq.addEventListener("change", sync);
})();
</script>
<style>

/* ── 보고서 자체의 틀 ──────────────────────────────────────────────

<script>
/* 공통 동작 — 여닫이(aria-controls) · 고르는 단추(Multi Toggle) · 탭. 판마다 data-theme 을 바꿀 수 있다. */
document.addEventListener("click", function (e) {
  var trigger = e.target.closest("[aria-controls][aria-expanded]");
  if (trigger) {
    var panel = document.getElementById(trigger.getAttribute("aria-controls"));
    if (!panel) return;
    var open = trigger.getAttribute("aria-expanded") === "true";
    trigger.setAttribute("aria-expanded", String(!open));
    if (panel.getAttribute("data-s1-part") === "panel-wrap") {
      if (open) panel.removeAttribute("data-open"); else panel.setAttribute("data-open", "true");
    } else { panel.hidden = open; }
    return;
  }
  var cell = e.target.closest('[data-s1-component="multi-toggle"] [data-s1-part="cell"]');
  if (cell) {
    var group = cell.closest('[data-s1-component="multi-toggle"]');
    group.querySelectorAll('[data-s1-part="cell"]').forEach(function (c) { c.setAttribute("aria-checked", String(c === cell)); });
    /* data-theme-target="판id" 이면 그 판의 라이트·다크를 바꾼다 */
    var tgt = group.getAttribute("data-theme-target");
    if (tgt) document.getElementById(tgt).setAttribute("data-theme", cell.dataset.value);
    group.dispatchEvent(new CustomEvent("pick", { detail: cell.dataset.value, bubbles: true }));
    return;
  }
  var tab = e.target.closest('[data-s1-component="tab"] [data-s1-part="tab"]');
  if (tab) {
    tab.parentNode.querySelectorAll('[data-s1-part="tab"]').forEach(function (t) {
      var on = t === tab;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      var p = document.getElementById(t.getAttribute("aria-controls"));
      if (p) p.hidden = !on;
    });
  }
});
/* 처음 화면 — 테마 판은 보는 사람의 테마를 따른다 */
(function () {
  var v = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  document.querySelectorAll("[data-theme-target]").forEach(function (g) {
    var el = document.getElementById(g.getAttribute("data-theme-target"));
    if (el) el.setAttribute("data-theme", v);
    g.querySelectorAll('[data-s1-part="cell"]').forEach(function (c) { c.setAttribute("aria-checked", String(c.dataset.value === v)); });
  });
})();
</script>
