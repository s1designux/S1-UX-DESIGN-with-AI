<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뱃지 토큰 연결</title>
<link rel="stylesheet" href="../../../assets/css/tokens.css">
<link rel="stylesheet" href="../../../assets/css/typography.css">
<link rel="stylesheet" href="../../../ui-library/dist/components/data-tag.css">
<style>
  /* 2026-10-13 정본 반영본 — 회색도 배포본(data-tag.css)과 태그 전용 토큰(color/tag/*/gray)만 쓴다. 이 화면에 색 규칙 없음. */
  body { margin: 0; font-family: "Pretendard Variable", "Pretendard", sans-serif; background: var(--color-bg-level-0); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; }
  .pane { padding: var(--spacing-24); background: var(--color-bg-level-0); color: var(--color-text-body-primary); }
  .pane h2 { margin: 0 0 var(--spacing-16); }
  table { border-collapse: collapse; }
  th, td { padding: var(--spacing-8) var(--spacing-12); text-align: left; vertical-align: middle; }
  th { color: var(--color-text-body-tertiary); }
  .new { background: var(--color-bg-level-1); }
  .map { margin-top: var(--spacing-24); }
  .map td, .map th { border-top: var(--border-width-default) solid var(--color-line-default); }
  .map code { font-size: var(--font-size-12); }
  .sw { display: inline-block; width: var(--spacing-12); height: var(--spacing-12); border-radius: var(--radius-4); border: var(--border-width-default) solid var(--color-line-default); vertical-align: middle; margin-right: var(--spacing-6); }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="pane" data-theme="light"><h2 class="typo-title-16b">라이트</h2><table data-slot></table><table class="map" data-map></table></section>
  <section class="pane" data-theme="dark"><h2 class="typo-title-16b">다크</h2><table data-slot></table><table class="map" data-map></table></section>
</div>
<script>
  const tones = [["blue","승인","파랑",false],["red","주의","빨강",false],
                 ["gray","대기","회색 · 새로 추가",true]];
  const tag = (shape, solid, tone, label) =>
    `<span data-s1-component="data-tag" data-shape="${shape}" data-solid="${solid}" data-tone="${tone}">${label}</span>`;
  document.querySelectorAll("[data-slot]").forEach(t => {
    t.innerHTML = `<tr><th class="typo-body-12m">색</th><th class="typo-body-12m">둥근 · 선</th><th class="typo-body-12m">둥근 · 채움</th><th class="typo-body-12m">네모 · 선</th><th class="typo-body-12m">네모 · 채움</th></tr>` +
      tones.map(([tone,label,name,isNew]) => `<tr class="${isNew ? "new" : ""}"><td class="typo-body-14m">${name}</td>` +
        ["chips","square"].flatMap(s => ["off","on"].map(o => `<td>${tag(s,o,tone,label)}</td>`)).join("") + `</tr>`).join("");
  });
  // 연결표 — tokens.css 에서 뽑아 넣은 값(2026-10-13 정본 반영 후). 파일로 열면 스타일시트를 읽을 수 없어 미리 풀어 둔다.
  const MAP = {"light": [["파랑 · 선형 테두리", "tag-line-border-blue", "blue-400", "#1D6CEB"], ["파랑 · 선형 글자", "tag-line-label-blue", "blue-400", "#1D6CEB"], ["파랑 · 채움 바탕", "tag-solid-bg-blue", "blue-400", "#1D6CEB"], ["파랑 · 채움 글자", "tag-solid-label-blue", "base-white", "#FFFFFF"], ["빨강 · 선형 테두리", "tag-line-border-red", "red-300", "#FF4554"], ["빨강 · 선형 글자", "tag-line-label-red", "red-300", "#FF4554"], ["빨강 · 채움 바탕", "tag-solid-bg-red", "red-300", "#FF4554"], ["빨강 · 채움 글자", "tag-solid-label-red", "base-white", "#FFFFFF"], ["회색 · 선형 테두리", "tag-line-border-gray", "gray-200", "#D9D9D9"], ["회색 · 선형 글자", "tag-line-label-gray", "gray-500", "#757575"], ["회색 · 채움 바탕", "tag-solid-bg-gray", "gray-100", "#E9E9E9"], ["회색 · 채움 글자", "tag-solid-label-gray", "gray-500", "#757575"]], "dark": [["파랑 · 선형 테두리", "tag-line-border-blue", "blue-dark-300", "#3070D8"], ["파랑 · 선형 글자", "tag-line-label-blue", "blue-dark-300", "#3070D8"], ["파랑 · 채움 바탕", "tag-solid-bg-blue", "blue-dark-300", "#3070D8"], ["파랑 · 채움 글자", "tag-solid-label-blue", "base-white", "#FFFFFF"], ["빨강 · 선형 테두리", "tag-line-border-red", "red-dark-350", "#F06070"], ["빨강 · 선형 글자", "tag-line-label-red", "red-dark-350", "#F06070"], ["빨강 · 채움 바탕", "tag-solid-bg-red", "red-dark-350", "#F06070"], ["빨강 · 채움 글자", "tag-solid-label-red", "base-white", "#FFFFFF"], ["회색 · 선형 테두리", "tag-line-border-gray", "gray-dark-500", "#3E4049"], ["회색 · 선형 글자", "tag-line-label-gray", "gray-dark-800", "#B8BABF"], ["회색 · 채움 바탕", "tag-solid-bg-gray", "gray-dark-200", "#24252C"], ["회색 · 채움 글자", "tag-solid-label-gray", "gray-dark-800", "#B8BABF"]]};
  document.querySelectorAll("[data-map]").forEach(t => {
    const rows = MAP[t.closest(".pane").dataset.theme];
    t.innerHTML = `<tr><th class="typo-body-12m">자리</th><th class="typo-body-12m">연결한 토큰</th><th class="typo-body-12m">기본 팔레트 · 값</th></tr>` +
      rows.map(([name, tok, f, h]) => `<tr class="${name.startsWith("회색") ? "new" : ""}"><td class="typo-body-12m">${name}</td><td><code>${tok}</code></td><td class="typo-body-12m"><span class="sw" style="background:${h}"></span>${f} · ${h}</td></tr>`).join("");
  });
</script>
</body>
</html>
