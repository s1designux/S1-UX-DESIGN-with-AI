<!doctype html><html lang="ko" data-theme="light"><head><meta charset="utf-8"><title>edge</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/ui-library/dist/assets/css/tokens.css">
<link rel="stylesheet" href="/ui-library/dist/assets/css/typography.css">
<link rel="stylesheet" href="/ui-library/dist/s1-ui.css">
<style>
 html,body{margin:0;font-family:Pretendard,sans-serif;background:#eef0f3}
 .sticky{position:sticky;top:0;z-index:10;height:200px;background:#dfe3e8;border-bottom:2px solid #9aa4b0;display:flex;align-items:flex-end;padding:8px;font-size:12px;color:#444}
 .card{margin:0 20px;background:#fff;border:1px solid #d8dbe0;border-radius:8px;height:300px;overflow:auto;padding:16px}
 .spacer{height:96px}
</style></head><body>
<div class="sticky">소비자 페이지의 sticky 크롬 (z-index:10) — 여기 덮이면 패널이 안 보인다</div>
<div class="spacer"></div>
<div class="card">
 <div data-s1-component="date-picker" data-size="md" data-break="pc" data-mode="single">
  <button type="button" data-s1-part="trigger" aria-haspopup="dialog" aria-expanded="false"><span data-s1-part="value">날짜 선택</span><span data-s1-part="icon" aria-hidden="true"></span></button>
  <div data-s1-part="panel" role="dialog" hidden><div data-s1-part="calendar"></div></div></div>
 <div style="height:600px"></div>
</div>
<div style="height:600px"></div>
<script type="module">
 import { autoInit } from "/ui-library/dist/s1-ui.auto.js";
 autoInit(document);
 setTimeout(()=>{document.querySelector('[data-s1-part="trigger"]').click();},400);
</script></body></html>
