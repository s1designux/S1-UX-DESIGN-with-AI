<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Textarea · Multi Toggle 상태 전수 대조 (실제 dist 소비)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../../ui-library/dist/assets/css/tokens.css">
<link rel="stylesheet" href="../../../ui-library/dist/assets/css/typography.css">
<link rel="stylesheet" href="../../../ui-library/dist/s1-ui.css">
<style>
  body { font-family: Pretendard, sans-serif; margin: 0; }
  .pane { padding: 20px 24px; }
  .pane[data-theme="dark"] { background: var(--color-bg-level-1); }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--color-text-body-primary); }
  h3 { font-size: 12px; margin: 18px 0 6px; color: var(--color-text-body-secondary); }
  .cellwrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .item { width: 240px; }
  .cap { font-size: 11px; color: var(--color-text-body-secondary); margin-bottom: 4px; }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  /* Hover 는 마우스를 올릴 수 없어 강제 표시(가이드와 동일 기법) */
  [data-s1-component="multi-toggle"] [data-force-state="hover"] {
    background: var(--color-button-bg-secondary--hover);
    border-color: var(--color-button-border-secondary--hover);
    color: var(--color-button-label-secondary--hover);
  }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
const ta = ({st,i,brk,theme}) => {
  const dis = st === 'disabled' ? ' disabled' : '';
  const ro  = st === 'readonly' ? ' readonly' : '';
  const val = (st === 'filled' || st === 'readonly') ? '디자인 시스템 적용 내용을 작성합니다.' : '';
  const af  = st === 'focus' ? ' data-autofocus="1"' : '';
  return `<div class="item"><div class="cap">${st}</div>
  <div data-s1-component="textarea" data-break="${brk}">
    <textarea id="ta-${theme}-${brk}-${st}-${i}" data-s1-part="control" aria-label="설명 ${st} ${theme}" placeholder="여러 줄 내용을 입력하세요"${dis}${ro}${af}>${val}</textarea>
  </div></div>`;
};
const mt = ({size,sel,i,dis,hov,theme}) => {
  const labels = ['왼쪽','가운데','오른쪽'];
  const cells = labels.map((l,n) => {
    const checked = n === sel;
    const d = (dis === n) ? ' aria-disabled="true"' : '';
    const h = (hov === n) ? ' data-force-state="hover"' : '';
    return `<button type="button" data-s1-part="cell" role="radio" aria-checked="${checked}" data-value="v${n}" tabindex="${checked?0:-1}"${d}${h}>${l}</button>`;
  }).join('');
  return `<div><div class="cap">${size} · 선택=${labels[sel]}${dis!=null?' · '+labels[dis]+' 비활성':''}${hov!=null?' · '+labels[hov]+' hover':''}</div>
  <div data-s1-component="multi-toggle" data-size="${size}" role="radiogroup" aria-label="정렬 ${theme}-${size}-${i}">${cells}</div></div>`;
};
function pane(theme) {
  let h = `<div class="pane" data-theme="${theme}"><h2>${theme.toUpperCase()}</h2>`;
  h += `<h3>Textarea — PC (정본 State 5)</h3><div class="cellwrap">`;
  ['default','focus','filled','disabled','readonly'].forEach((st,i) => { h += ta({st,i,brk:'pc',theme}); });
  h += `</div>`;
  h += `<h3>Textarea — Mobile</h3><div class="cellwrap">`;
  ['default','filled','disabled','readonly'].forEach((st,i) => { h += ta({st,i:i+10,brk:'mobile',theme}); });
  h += `</div>`;
  h += `<h3>Multi Toggle — MD (44)</h3><div class="row">`;
  [0,1,2].forEach((sel,i) => { h += mt({size:'md',sel,i,theme}); });
  h += mt({size:'md',sel:0,i:5,hov:1,theme});
  h += mt({size:'md',sel:0,i:6,dis:2,theme});
  h += `</div>`;
  h += `<h3>Multi Toggle — SM (34)</h3><div class="row">`;
  [0,1,2].forEach((sel,i) => { h += mt({size:'sm',sel,i:i+20,theme}); });
  h += mt({size:'sm',sel:0,i:25,hov:1,theme});
  h += mt({size:'sm',sel:0,i:26,dis:2,theme});
  h += `</div></div>`;
  return h;
}
const only = new URLSearchParams(location.search).get('only');
document.getElementById('out').innerHTML = only ? pane(only) : (pane('light') + pane('dark'));
const want = new URLSearchParams(location.search).get('focus') || 'light';
const panes = [...document.querySelectorAll('.pane')];
const targetPane = panes.find(p => p.dataset.theme === want) || panes[0];
const f = targetPane.querySelector('[data-autofocus="1"]');
if (f) f.focus();
</script>
</body>
</html>
