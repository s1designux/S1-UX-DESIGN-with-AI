<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <script>!function(){var z=localStorage.getItem("sw-ds-zoom");if(z)document.documentElement.style.zoom=z+"%"}();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Builder · S1 UX DESIGN GUIDE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/typography.css">
  <link rel="stylesheet" href="../ui-library/dist/s1-ui.css">
  <style>
        /* [layout-gate] 전폭 — 화면 폭에 맞춰 컨텐츠 확장 (자동관리: npm run layout:check -- --fix) */
    .page-content { max-width: none; }
    .page-header-inner { max-width: none; }

    .page-header { position: static !important; border-bottom: none; padding-bottom: 12px; }
    .page-content { padding: 0 24px 24px; }

    /* ── Builder shell ─────────────────────────────────────────── */
    .pb { display: grid; grid-template-columns: 272px minmax(0, 1fr) 300px; gap: 12px; min-height: calc(100vh - 150px); }
    @media (max-width: 1100px) { .pb { grid-template-columns: 1fr; } }
    .pb-panel { border: 1px solid var(--color-line-gray-subtle); border-radius: var(--radius-12); background: var(--color-bg-level-0); display: flex; flex-direction: column; min-height: 0; }
    .pb-panel-head { padding: 10px 14px; border-bottom: 1px solid var(--color-line-gray-subtle); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pb-panel-title { font-size: 12px; font-weight: 700; color: var(--color-text-title-secondary); margin: 0; letter-spacing: .02em; }
    .pb-panel-body { padding: 12px 14px; overflow: auto; flex: 1; font-size: 12px; color: var(--color-text-body-secondary); }

    /* toolbar */
    .pb-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--color-line-gray-subtle); border-radius: var(--radius-12); background: var(--color-bg-level-0); }
    .pb-field { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-body-secondary); }
    .pb-field select, .pb-field input[type="text"] { font: inherit; font-size: 12px; padding: 4px 8px; border: 1px solid var(--color-line-gray-subtle); border-radius: var(--radius-6); background: var(--color-bg-level-0); color: var(--color-text-body-primary); min-width: 0; }
    .pb-field input[type="text"] { width: 160px; }
    .pb-spacer { flex: 1; }
    .pb-btn { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: var(--radius-6); border: 1px solid var(--color-line-gray-subtle); background: var(--color-bg-level-0); color: var(--color-text-body-primary); cursor: pointer; }
    .pb-btn:hover { background: var(--color-bg-level-1); }
    .pb-btn-primary { background: var(--color-button-bg-primary--default); border-color: var(--color-button-border-primary--default); color: var(--color-button-label-primary--default); }
    .pb-btn-primary:hover { background: var(--color-button-bg-primary--hover); }
    .pb-btn-sm { padding: 3px 8px; font-size: 11px; font-weight: 500; }
    .pb-btn[disabled] { opacity: .45; cursor: not-allowed; }

    /* left: patterns + parts */
    .pb-list { display: flex; flex-direction: column; gap: 4px; }
    .pb-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border: 1px solid var(--color-line-gray-subtle); border-radius: var(--radius-8); background: var(--color-bg-level-0); cursor: pointer; font-size: 12px; color: var(--color-text-body-primary); }
    .pb-item:hover { background: var(--color-bg-level-1); }
    .pb-item[data-unavailable="true"] { opacity: .45; cursor: not-allowed; }
    .pb-item small { color: var(--color-text-body-tertiary); font-size: 11px; }
    .pb-group-label { margin: 12px 0 6px; font-size: 11px; font-weight: 700; color: var(--color-text-body-tertiary); text-transform: uppercase; letter-spacing: .04em; }
    .pb-group-label:first-child { margin-top: 0; }
    .pb-empty { padding: 14px 12px; border: 1px dashed var(--color-line-gray-subtle); border-radius: var(--radius-8); color: var(--color-text-body-tertiary); line-height: 1.6; font-size: 12px; }

    /* center: canvas */
    .pb-stage { background: var(--color-bg-level-1); padding: 24px; overflow: auto; flex: 1; border-radius: 0 0 var(--radius-12) var(--radius-12); }
    .pb-canvas { margin: 0 auto; background: var(--color-bg-level-0); box-shadow: var(--shadow-raised); min-height: 480px; transition: max-width .2s; }
    .pb-canvas[data-theme="dark"] { color-scheme: dark; }
    .pb-frame-label { text-align: center; font-size: 11px; color: var(--color-text-body-tertiary); margin: 0 0 8px; }
    .pb-canvas .s1-row[data-pb-row] { position: relative; outline: 1px dashed transparent; outline-offset: 4px; border-radius: var(--radius-4); }
    .pb-canvas .s1-row[data-pb-row]:hover { outline-color: var(--color-line-gray-subtle); }
    .pb-canvas .s1-row[data-pb-selected="true"] { outline: 1px dashed var(--color-line-blue); }
    .pb-canvas .s1-block[data-pb-block] { position: relative; outline: 1px solid transparent; outline-offset: 2px; border-radius: var(--radius-4); cursor: pointer; }
    .pb-canvas .s1-block[data-pb-block]:hover { outline-color: var(--color-line-gray-subtle); }
    .pb-canvas .s1-block[data-pb-selected="true"] { outline: 2px solid var(--color-line-blue); }
    .pb-row-add { display: flex; justify-content: center; padding: 12px 0 0; }
    .pb-canvas-empty { padding: 60px 24px; text-align: center; color: var(--color-text-body-tertiary); font-size: 13px; line-height: 1.7; }

    /* right: properties */
    .pb-prop { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pb-prop label { font-size: 11px; color: var(--color-text-body-tertiary); }
    .pb-prop select, .pb-prop input, .pb-prop textarea { font: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--color-line-gray-subtle); border-radius: var(--radius-6); background: var(--color-bg-level-0); color: var(--color-text-body-primary); width: 100%; box-sizing: border-box; }
    .pb-prop textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; min-height: 120px; grid-column: 1 / -1; }
    .pb-prop-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
    .pb-section-title { font-size: 11px; font-weight: 700; color: var(--color-text-title-secondary); margin: 14px 0 8px; padding-top: 12px; border-top: 1px solid var(--color-line-gray-subtle); }
    .pb-section-title:first-child { margin-top: 0; padding-top: 0; border-top: none; }
    .pb-note { font-size: 11px; line-height: 1.6; color: var(--color-text-body-tertiary); margin: 4px 0 10px; }
    .pb-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: var(--radius-8); background: var(--color-text-title-primary); color: var(--color-bg-level-0); font-size: 12px; box-shadow: var(--shadow-raised); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
    .pb-toast[data-show="true"] { opacity: 1; }

    /* modal-ish request form */
    .pb-dialog { position: fixed; inset: 0; background: var(--color-overlay); display: none; align-items: center; justify-content: center; z-index: 40; }
    .pb-dialog[data-open="true"] { display: flex; }
    .pb-dialog-card { width: min(560px, calc(100vw - 32px)); background: var(--color-bg-level-0); border-radius: var(--radius-12); padding: 20px; box-shadow: var(--shadow-raised); }
    .pb-dialog-card h3 { margin: 0 0 6px; font-size: 15px; color: var(--color-text-title-primary); }
    .pb-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .pb-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; background: var(--color-bg-level-1); border-radius: var(--radius-8); padding: 10px; max-height: 200px; overflow: auto; color: var(--color-text-body-primary); }
  </style>
</head>
<body>

<div class="mobile-header">
  <button class="hamburger" id="sidebar-toggle" aria-label="메뉴 열기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <span class="mobile-logo">S1 UX DESIGN GUIDE</span>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header">
      <div class="page-header-inner">
        <div class="page-header-text">
          <h1>Pattern Builder</h1>
          <p>배포 중인 부품(s1-ui)을 서비스·플랫폼에 맞게 조합해 화면을 만들고, 그대로 쓰는 HTML/CSS 로 내보냅니다. 부품을 새로 그리지 않고 배포본만 조립합니다.</p>
        </div>
        <div class="page-header-actions">
          <span class="badge badge-blue" id="pb-dist-version">s1-ui</span>
        </div>
      </div>
    </div><!-- /page-header -->

    <div class="page-content">

      <div class="pb-toolbar" id="pb-toolbar">
        <label class="pb-field">화면 이름 <input type="text" id="pb-name" placeholder="예: 목록 조회"></label>
        <label class="pb-field">서비스 <select id="pb-service"></select></label>
        <label class="pb-field">플랫폼 <select id="pb-platform"></select></label>
        <label class="pb-field">역할 <select id="pb-role"></select></label>
        <label class="pb-field">테마 <select id="pb-theme"><option value="light">라이트</option><option value="dark">다크</option></select></label>
        <span class="pb-spacer"></span>
        <button type="button" class="pb-btn" id="pb-new">새 화면</button>
        <button type="button" class="pb-btn" id="pb-save">화면 저장(JSON)</button>
        <label class="pb-btn" for="pb-load-file">불러오기<input type="file" id="pb-load-file" accept="application/json" hidden></label>
        <button type="button" class="pb-btn" id="pb-share">링크 복사</button>
        <button type="button" class="pb-btn" id="pb-request">새 패턴 요청</button>
        <button type="button" class="pb-btn pb-btn-primary" id="pb-export">HTML 내보내기</button>
      </div>

      <div class="pb">
        <!-- 왼쪽: 패턴 · 부품 -->
        <section class="pb-panel" aria-label="패턴과 부품">
          <div class="pb-panel-head"><h2 class="pb-panel-title">패턴 · 부품</h2></div>
          <div class="pb-panel-body">
            <p class="pb-group-label">패턴</p>
            <div class="pb-list" id="pb-pattern-list"></div>
            <p class="pb-group-label">레이아웃 보조</p>
            <div class="pb-list" id="pb-helper-list"></div>
            <div id="pb-part-groups"></div>
          </div>
        </section>

        <!-- 가운데: 캔버스 -->
        <section class="pb-panel" aria-label="화면 미리보기">
          <div class="pb-panel-head">
            <h2 class="pb-panel-title">미리보기</h2>
            <span class="pb-note" id="pb-frame-info" style="margin:0"></span>
          </div>
          <div class="pb-stage">
            <p class="pb-frame-label" id="pb-frame-label"></p>
            <div class="pb-canvas" id="pb-canvas"></div>
            <div class="pb-row-add"><button type="button" class="pb-btn pb-btn-sm" id="pb-add-row">+ 행 추가</button></div>
          </div>
        </section>

        <!-- 오른쪽: 속성 -->
        <section class="pb-panel" aria-label="속성">
          <div class="pb-panel-head"><h2 class="pb-panel-title">속성</h2></div>
          <div class="pb-panel-body" id="pb-props"></div>
        </section>
      </div>

    </div><!-- /page-content -->
  </main>
</div>

<!-- 새 패턴 요청 -->
<div class="pb-dialog" id="pb-request-dialog" role="dialog" aria-modal="true" aria-labelledby="pb-request-title">
  <div class="pb-dialog-card">
    <h3 id="pb-request-title">새 패턴 요청</h3>
    <p class="pb-note">지금 캔버스에 놓인 구성이 함께 담깁니다. 저장된 요청 파일을 Claude 에게 주면 디자인 문법에 맞는 패턴을 제안하고, 검증을 거쳐 이 빌더의 패턴 목록에 올립니다.</p>
    <div class="pb-prop"><label for="pb-req-name">패턴 이름</label><input type="text" id="pb-req-name" placeholder="예: 목록 조회 + 검색"></div>
    <div class="pb-prop"><label for="pb-req-purpose">어디에 쓰나</label><input type="text" id="pb-req-purpose" placeholder="예: 관리자가 장비 목록을 검색하고 상세로 들어간다"></div>
    <div class="pb-prop"><label for="pb-req-notes">요청 내용</label><textarea id="pb-req-notes" placeholder="필요한 요소, 참고 화면(Figma 링크), 꼭 지켜야 할 것"></textarea></div>
    <pre class="pb-code" id="pb-req-preview" hidden></pre>
    <div class="pb-dialog-actions">
      <button type="button" class="pb-btn" id="pb-req-cancel">닫기</button>
      <button type="button" class="pb-btn" id="pb-req-copy">내용 복사</button>
      <button type="button" class="pb-btn pb-btn-primary" id="pb-req-download">요청 파일 저장</button>
    </div>
  </div>
</div>

<div class="pb-toast" id="pb-toast" role="status"></div>

<script src="../assets/js/main.js"></script>
<script type="module" src="../assets/js/builder.js"></script>
</body>
</html>
