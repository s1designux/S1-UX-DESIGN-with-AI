<!-- 패널 접기 (line) — 아이콘 가이드 line 스타일을 따라 그렸다.
     24 프레임 · 단선(monoline) · 굵기 1 · 모서리·끝 각짐.
     잉크 크기 18×14 — 가이드 원본 실측과 같다(ic_메뉴 18×13 · ic_폴더 18×14 · ic_공간레이아웃 18×14).
     뜻: 왼쪽 판(LNB)을 접는다. 화면 네모 + 왼쪽 판 + 왼쪽을 가리키는 꺾쇠.
     ⚠️ 아직 아이콘 가이드에 등록되지 않은 후보다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <rect x="3.5" y="5.5" width="17" height="13" stroke="black" stroke-width="1"/>
  <path d="M9.5 5.5V18.5" stroke="black" stroke-width="1"/>
  <path d="M16.25 9.5L13.75 12L16.25 14.5" stroke="black" stroke-width="1" stroke-linecap="square"/>
</svg>
